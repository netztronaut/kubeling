{{- if and .Values.rbac.create .Values.leaderElection.enabled -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubeling.fullname" . }}
  namespace: {{ .Values.leaderElection.namespace }}
  labels:
    {{- include "kubeling.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubeling.fullname" . }}
  namespace: {{ .Values.leaderElection.namespace }}
  labels:
    {{- include "kubeling.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubeling.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeling.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
