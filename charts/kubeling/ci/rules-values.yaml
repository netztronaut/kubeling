# Example values exercising every rule map. Used by hack/test-chart.sh and
# validated against the controller's config schema by pkg/config tests.
config:
  initialization:
    kubelet-provider-id:
      providerIDPattern: '^metal://'
    bare-metal:
      nodeSelector:
        example.com/provider: bare-metal
      providerIDScheme: custom
  externalIPs:
    edge:
      nodeSelector:
        topology.kubernetes.io/zone: eu-central-1a
      externalIPs:
        - 2001:db8::10
        - 203.0.113.10
  labels:
    edge:
      providerIDPattern: '^custom://edge-'
      selectorTerms:
        - matchExpressions:
            - key: topology.kubernetes.io/zone
              operator: In
              values:
                - eu-central-1a
                - eu-central-1b
      labels:
        environment: production
        node-role.kubernetes.io/public: ""
  annotations:
    edge:
      nodeSelector:
        topology.kubernetes.io/zone: eu-central-1a
      annotations:
        example.com/rack: r42
