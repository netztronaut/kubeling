# Example rule ConfigMap. Not applied by `kubectl apply -f deploy/`; copy and
# adapt it, then set the CONFIGMAP environment variable in deployment.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubeling-config
  namespace: kube-system
data:
  config.yaml: |
    initialization:
      bare-metal:
        nodeSelector:
          example.com/provider: bare-metal
        providerIDScheme: custom
    externalIPs:
      edge:
        nodeSelector:
          topology.kubernetes.io/zone: eu-central-1a
        externalIPs:
          - 2001:db8::10
          - 203.0.113.10
    labels:
      edge:
        providerIDPattern: '^custom://edge-'
        selectorTerms:
          - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values:
                  - eu-central-1a
                  - eu-central-1b
        labels:
          environment: production
    annotations:
      edge:
        nodeSelector:
          topology.kubernetes.io/zone: eu-central-1a
        annotations:
          example.com/rack: r42
