name: Release

# Publishes the container image to ghcr.io/<owner>/kubeling and the Helm
# chart to oci://ghcr.io/<owner>/charts/kubeling:
#
#   push to main    image :latest, :main, :sha-<short>
#                   chart <Chart.yaml version>-main.<run>, appVersion sha-<short>
#   tag vX.Y.Z[-*]  image :X.Y.Z[-*] (and :X.Y for final releases)
#                   chart X.Y.Z[-*], appVersion X.Y.Z[-*]; the tag's X.Y.Z
#                   must equal the version in Chart.yaml
#                   GitHub release (GoReleaser): binaries, checksums,
#                   changelog and the packaged chart; -* tags are prereleases
#   pull request    everything is built, nothing is pushed or released

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  CHART_DIR: charts/kubeling
  HELM_VERSION: v4.1.4
  GORELEASER_VERSION: v2.18.1
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      chart-version: ${{ steps.version.outputs.chart-version }}
      app-version: ${{ steps.version.outputs.app-version }}
      push: ${{ steps.version.outputs.push }}
      owner: ${{ steps.version.outputs.owner }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: |
          base="$(awk '$1 == "version:" { print $2; exit }' "$CHART_DIR/Chart.yaml")"
          short_sha="${GITHUB_SHA::7}"
          case "$GITHUB_REF" in
            refs/tags/v*)
              chart_version="${GITHUB_REF_NAME#v}"
              if [ "${chart_version%%-*}" != "$base" ]; then
                echo "::error::tag $GITHUB_REF_NAME doesn't match version $base in $CHART_DIR/Chart.yaml"
                exit 1
              fi
              app_version="$chart_version"
              push=true
              ;;
            refs/heads/main)
              chart_version="$base-main.$GITHUB_RUN_NUMBER"
              app_version="sha-$short_sha"
              push=true
              ;;
            *)
              chart_version="$base-dev.$GITHUB_RUN_NUMBER"
              app_version="sha-$short_sha"
              push=false
              ;;
          esac
          {
            echo "chart-version=$chart_version"
            echo "app-version=$app_version"
            echo "push=$push"
            echo "owner=${GITHUB_REPOSITORY_OWNER,,}"
          } | tee -a "$GITHUB_OUTPUT"

  image:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - if: needs.version.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ needs.version.outputs.owner }}/kubeling
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: ${{ needs.version.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    needs: [version, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      CHART_VERSION: ${{ needs.version.outputs.chart-version }}
      APP_VERSION: ${{ needs.version.outputs.app-version }}
      CHART_REPOSITORY: oci://ghcr.io/${{ needs.version.outputs.owner }}/charts
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Package
        run: |
          helm package "$CHART_DIR" --destination dist \
            --version "$CHART_VERSION" --app-version "$APP_VERSION"

      - name: Push
        if: needs.version.outputs.push == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHART_PACKAGE_DIR: ${{ runner.temp }}/chart
          OWNER: ${{ needs.version.outputs.owner }}
        run: |
          helm registry login "$REGISTRY" --username "$GITHUB_ACTOR" --password-stdin <<<"$GITHUB_TOKEN"
          helm push "dist/kubeling-$CHART_VERSION.tgz" "$CHART_REPOSITORY"

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: chart
          path: dist/kubeling-${{ env.CHART_VERSION }}.tgz
          if-no-files-found: error
          retention-days: 1

  # Runs last so a tag only becomes a GitHub release once its image and
  # chart are published. Outside tags it builds a snapshot, which validates
  # .goreleaser.yaml without publishing anything.
  release:
    needs: [version, image, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser needs the tags and history for the changelog.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@v8
        with:
          name: chart
          # Outside the checkout, so GoReleaser doesn't see a dirty tree.
          path: ${{ runner.temp }}/chart

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean ${{ !startsWith(github.ref, 'refs/tags/v') && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHART_PACKAGE_DIR: ${{ runner.temp }}/chart
          OWNER: ${{ needs.version.outputs.owner }}
